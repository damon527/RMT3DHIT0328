# CFG file for HIT + 25 deformable spherical particles at 128^3 with 3D velocity/PPE/PPF output
# Keyword                  Input
#
# IO PARAMETERS
ntracers                  0

# HIT cold-start 插入颗粒后源码会将 chk_num/chk_step/time 重置为 0，
# 因此这里 frames=100 表示双相生产阶段输出约 100 个 frame。
frames                    100

chkpt_freq                10

# dump_code (additive)
# 1  = tracer
# 2  = contour
# 4  = specific slices
# 8  = chkpt files
# 16 = diagnostic file
# 32 = macro stats file
# 64 = 3D velocity/exchange fields: vx3d, vy3d, vz3d, ppf3d, ppe3d
#
# 2 + 4 + 8 + 32 + 64 = 110
dump_code                 110

# out_flag bitmask:
# 1:vx 2:vy 4:vz 8:wx 16:wy 32:wz 64:|w| 128:p ...
# 这里仍然只输出2D wz切片；完整3D速度场由dump_code 64单独输出
out_flag                  32
output_dim                2
output_ind                32

#
# DOMAIN BOUNDARY CONDITIONS (HIT 三向周期)
x_prd                     1
y_prd                     1
z_prd                     1

# 周期边界下这些BC基本不会生效
bc_xl                     0 0 0 0 0 0
bc_xh                     0 0 0 0 0 0
bc_yl                     0 0 0 0 0 0
bc_yh                     0 0 0 0 0 0
bc_zl                     0 0 0 0 0 0
bc_zh                     0 0 0 0 0 0

# 墙面关闭
walls                     0 0 0 0 0 0
wall_pos                  0 1 0 1 0 1
wall_dist                 0.0

#
# SOLVER PARAMETERS
sys_size                  128 128 128

# HIT 常用立方体周期域 2*pi
xyz_bounds                0 6.283185307179586 0 6.283185307179586 0 6.283185307179586

# 25颗粒/约5.28%体积分数下，保持当前测试时间步
dt                        0.001

# 双相自然衰减统计时间
T                         8

#
# SIMULATION TYPE CONFIGURATIONS
sim_type                  objects

#
# FLUID PROPERTIES
fmu                       0.005428
fdt_pad                   0.5
data_fmt                  0

#
# ISOTROPIC TURBULENCE BACKGROUND
turb_iso_enable           1
turb_mode_count           64
turb_kf2                  3
turb_seed                 13579
turb_kd                   50.0
turb_re_lam               84.0

#
# HIT COLD-START / RECOVERY CONTROL

# 读取单相HIT背景后插入颗粒
hit_cold_start_enable     1
hit_cold_start_time       0.0

# 关键：指向第一阶段单相输出目录
# 运行前请确认:
# test -f /home/hhq/codes_ios/RMT3Dios/sim_configs/hit10_single.out/chk.00049/recover.cfg && echo OK
recover_dirname           /home/hhq/codes_ios/RMT3Dios/sim_configs/hit10_single.out

# 读取第一阶段最后一个 checkpoint
chk_num                   49

# 双相阶段不再额外写单相背景 checkpoint
hit_write_background_chk  0
hit_background_chk_num    49

# 插入颗粒后关闭强迫，研究自然衰减
hit_keep_forcing_after_insert 0

# 多颗粒插入后建议增加预迭代；如仍不稳可提高到300
hit_pre_iter_steps        100

#
# SOLIDS CONFIGURATIONS

# 25 个可变形球颗粒
gravity                   0.0

# 多颗粒下先避免 nlayers=6 顶到 Search radius=6
nlayers                   4
wt_n                      1
ex_visc_mult              1
ev_trans_mult             0

n_obj                     25

