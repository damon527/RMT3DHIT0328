# CFG file for HIT + 10 deformable spherical particles at 128^3 with 3D velocity/PPE/PPF output
# Keyword                  Input
#
# IO PARAMETERS
ntracers                  0

# 重要说明：
# 当前stepper使用 chk_num 作为初始frame编号。
# 如果读取 chk.00049 且希望双相阶段输出100个frame，
# 则 frames 需要设为 149，使输出frame编号约为 00049 ... 00148，共100个。
frames                    149

chkpt_freq                10

# dump_code (additive)
# 1  = tracer
# 2  = contour
# 4  = specific slices
# 8  = chkpt files
# 16 = diagnostic file
# 32 = macro stats file
# 64 = 3D velocity/exchange fields: vx3d, vy3d, vz3d, ppf3d, ppe3d
#
# 双相阶段:
# 2 + 4 + 8 + 32 + 64 = 110
dump_code                 110

# out_flag bitmask:
# 1:vx 2:vy 4:vz 8:wx 16:wy 32:wz 64:|w| 128:p ...
# 这里仍然只输出2D wz切片；完整3D速度场由dump_code 64单独输出
out_flag                  32
output_dim                2
output_ind                32

#
# DOMAIN BOUNDARY CONDITIONS (HIT 三向周期)
x_prd                     1
y_prd                     1
z_prd                     1

# 周期边界下这些BC基本不会生效
bc_xl                     0 0 0 0 0 0
bc_xh                     0 0 0 0 0 0
bc_yl                     0 0 0 0 0 0
bc_yh                     0 0 0 0 0 0
bc_zl                     0 0 0 0 0 0
bc_zh                     0 0 0 0 0 0

# 墙面关闭
walls                     0 0 0 0 0 0
wall_pos                  0 1 0 1 0 1
wall_dist                 0.0

#
# SOLVER PARAMETERS
sys_size                  128 128 128

# HIT 常用立方体周期域 2*pi
xyz_bounds                0 6.283185307179586 0 6.283185307179586 0 6.283185307179586

# 128^3 双相阶段沿用你当前时间步
# 若插入后仍出现外推/投影不稳定，建议优先试 0.0005 或 0.00025
dt                        0.001

# 双相自然衰减统计时间
T                         16

#
# SIMULATION TYPE CONFIGURATIONS
sim_type                  objects

#
# FLUID PROPERTIES
fmu                       0.005428
fdt_pad                   0.5
data_fmt                  0

#
# ISOTROPIC TURBULENCE BACKGROUND
turb_iso_enable           1
turb_mode_count           64
turb_kf2                  3
turb_seed                 13579
turb_kd                   50.0
turb_re_lam               84.0

#
# HIT COLD-START / RECOVERY CONTROL

# 双相阶段开启cold-start恢复逻辑：
# 读取第一阶段单相HIT背景，然后插入颗粒
hit_cold_start_enable     1
hit_cold_start_time       0.0

# 关键：指向第一阶段输出目录
recover_dirname           /home/hhq/codes_ios/RMT3Dios/sim_configs/hit10_single.out

# 读取第一阶段最后一个checkpoint
# 第一阶段 frames=50 且 chkpt_freq=49，因此有 chk.00049
chk_num                   49

# 双相阶段不再额外写单相背景checkpoint
hit_write_background_chk  0
hit_background_chk_num    49

# 插入颗粒后关闭强迫，研究自然衰减
hit_keep_forcing_after_insert 0

# 插入后预迭代，减缓流固耦合瞬态冲击
hit_pre_iter_steps        100

#
# SOLIDS CONFIGURATIONS

# 10 个可变形球颗粒
# 按现有示例，球对象使用 object_list = 1

# extra_specs: [index + 10个参数]
# 参考现有 sphere 示例给默认不预拉伸参数

# 颗粒密度与剪切模量（可变形）
gravity                   0.0

#
# SOLIDS CONFIGURATIONS (auto-generated)
nlayers                   6
wt_n                      2
ex_visc_mult              1
ev_trans_mult             0

n_obj                     10

object_list               0 1
object_list               1 1
object_list               2 1
object_list               3 1
object_list               4 1
object_list               5 1
object_list               6 1
